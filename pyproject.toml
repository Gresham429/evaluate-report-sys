[project]
name = "guijia-report"
version = "1.0.2"
description = "房地产估价报告生成系统"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "docxtpl>=0.17.0",
    "python-docx>=1.1.2",
    "PyMuPDF>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0.2",
    "Pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-openpyxl>=3.1.5.20260518",
    "types-pyyaml>=6.0.12.20260518",
    "httpx2>=2.7.0",
    "pyinstaller>=6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# PyMuPDF(fitz) 不提供类型存根。官方 pymupdf-stubs 仅支持 Python>=3.12，
# 而本项目要保 3.11 —— 类型存根是锦上添花，跨版本兼容是地基，故显式接受无存根。
[[tool.mypy.overrides]]
module = ["fitz.*", "fitz"]
ignore_missing_imports = true

# docxtpl 不随包分发 py.typed，PyPI 也无 types-docxtpl 存根包可装。
[[tool.mypy.overrides]]
module = ["docxtpl.*", "docxtpl"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
