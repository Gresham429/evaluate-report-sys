[project]
name = "guijia-report"
version = "0.1.0"
description = "房地产估价报告生成系统"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "docxtpl>=0.17.0",
    "python-docx>=1.1.2",
    "PyMuPDF>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0.2",
    "Pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
