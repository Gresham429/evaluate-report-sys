# 打 Windows exe 并产出可交付 zip。
#
# PyInstaller 不支持交叉编译，只有在 Windows 机器上跑才产出 .exe。本工作流就是
# 那台 Windows 机器。
#
# **冒烟测试是本流程的重点，不是装饰。** 「编译通过」与「exe 能用」是两回事：
# 合并前那个冻结路径 bug——数据每次关闭清零、一份报告也生成不了——编译一路
# 绿灯，开发环境毫无征兆。故这里必须真把 exe 跑起来、真出一份报告、真回头看
# 磁盘。见 tools/smoke_exe.py。
#
# 单元测试不在这里跑：它们要 `案例素材/` 的三份真 Excel（含真实客户数据，
# 已 gitignore，不上云）。没有素材时 conftest 会整体 skip——那样的「测试通过」
# 是假的，不如不跑。**代码正确性在本地把关**（uv run pytest，320 项），
# CI 只管产出与冒烟。

name: 打包 Windows exe

on:
  push:
    tags: ["v*"]          # 打 tag 即出正式包
  workflow_dispatch:      # 也能手动点一下就构建，不必先打 tag

permissions:
  contents: write         # 打 tag 时创建 Release 需要

env:
  # Windows 控制台默认不是 UTF-8，Python 会把中文退化成 ① 这类转义再输出。
  # 成功时只是难看，失败时是真麻烦——冒烟测试的报错全是中文，读不懂等于没有报错。
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen

      # tag 与 src/version.py 不一致就失败。否则两者迟早各说各话——
      # 2026-07-16 之前 pyproject 写 0.1.0 而 tag 已到 v1.0.1，正是如此。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code_version=$(uv run python -c "from src.version import __version__; print(__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "src/version.py = $code_version ； git tag = $tag_version"
          if [ "$code_version" != "$tag_version" ]; then
            echo "✗ 不一致。改 tag 或改 src/version.py，别让它们各说各话。"
            exit 1
          fi

      - name: 打包
        run: uv run python build_exe.py

      - name: 冒烟测试（暂存目录）——验它真能用，不只是编译过了
        run: uv run python tools/smoke_exe.py "dist/_package/appraisal-report-system/appraisal-report-system.exe"

      # **对着真发出去的 zip 再冒烟一遍。** 上面那步跑的是暂存目录（普通文件复制，
      # 名字完好），可用户拿到的是 zip、要自己解压——两者不是一回事。合并前那个坑
      # 正是这么溜过去的方向：中文模板名进 zip、被第三方解压软件按 GBK 解成乱码，
      # render() 就找不到，一份报告也出不来。现在名字全 ASCII 不该再乱，但这条盲区
      # 必须有测试兜住：真解压、真跑、真出一份报告，才算验到了交付形态。
      - name: 冒烟测试（解压交付 zip）——验用户真正拿到的那个包
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'delivered'
          Expand-Archive -Path 'dist/appraisal-report-system-windows.zip' -DestinationPath $dest -Force
          uv run python tools/smoke_exe.py "$dest/appraisal-report-system/appraisal-report-system.exe"

      # 名字只能用 ASCII：GitHub 会把资产名/产物名里的非 ASCII 字符直接删掉，
      # 「估价报告系统-windows.zip」上传后变成「-windows.zip」（v1.0.0 实测）。
      - name: 上传交付包
        uses: actions/upload-artifact@v4
        with:
          name: appraisal-report-system-windows
          path: dist/appraisal-report-system-windows.zip
          if-no-files-found: error
          retention-days: 90

      # 打了 tag 才发 Release，手动触发只留 artifact。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/appraisal-report-system-windows.zip
          body: |
            下载 `appraisal-report-system-windows.zip`，**完整解压到一个文件夹**，
            再双击 `appraisal-report-system/appraisal-report-system.exe`，浏览器
            自动打开。（别在压缩软件里直接双击 exe——那样模板没解压出来，出不了报告。）

            **首次使用须先导入基础表**：到「基础表」页，导入贵司的
            「实勘表、比较法.xlsx」，三类各一次。详见包内 `使用说明.md`。

            **升级时只替换 exe 与 templates/、copy.yaml，不要动 `data/`**
            ——实例库、草稿、基础表各版本都在里面。
