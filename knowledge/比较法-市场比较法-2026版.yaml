# 比较法的完整、显式表述。这是权威文档，供估价师阅读核对。
# 策略实现（src/engine/methods/market_2026.py）须与本文件逐条对应。
方法: 市场比较法
版本: 2026-07
适用类别: [农用, 办公, 商业]
基准值: 100

公式:
  因素指数: (实例档次分 − 估价对象档次分) × 每差1档系数 + 基准值
  比准价格: 成交价 × (基准值/交易情况指数) × (市场状况指数/基准值) × ∏(基准值/因素指数)
  评估结果: Σ(比准价格 × 权重)
  离散度: MAX(比准价格) / MIN(比准价格) − 1

权重:
  默认: [0.333333333333333, 0.333333333333333, 0.333333333333333]
  说明: 三个实例等权。本版不可调——报告正文不披露权重取值，可调会使结论不可追溯。

知识表来源:
  工作表: 比较因素条件说明表（基础表）
  因素行: [3, 30]      # 按实际非空行取，农用 27 个、办公商业 28 个
  档次列: [D, H]
  分值行: 31
  系数列: I

对照基准:              # 验收锁死，算歪即红
  农用:
    比准价格: [1410, 1393.89, 1393.89]
    评估结果: 1399.26
    离散度: 0.01
  办公:
    比准价格: [2.92, 2.77, 2.80]
    评估结果: 2.83
    离散度: 0.05
  商业:
    比准价格: [3.15, 3.40, 3.40]
    评估结果: 3.32
    离散度: 0.08
