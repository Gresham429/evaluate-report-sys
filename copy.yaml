  para_026: 估价目的：为委托人确定拟出租房地产市场租金提供价格参考，而评估房地产租赁价值。
  para_027: 本报告所提供的是上述房地产在满足全部假设和限制条件下于价值时点的租赁价值。
  para_028: 2.遵循合法原则，评估价值应为在依法判定的估价对象状况下的价值或价格；
