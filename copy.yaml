boilerplate:
  para_001: 估价人员在认真分析所掌握的资料，并对估价对象进行了实地查勘以及对周边房地产市场的分析，依据《房地产估价规范》估价对象的特点及本次估价目的，遵照国家有关法律、法规、估价技术标准，经过反复研究，本次估价对象租赁价值选用比较法进行评估，并对上述评估方法的测算确定评估价值。
  para_002: 8.未经委托人和本公司书面同意，本估价报告不得向估价委托人、估价目的的有关方和估价报告审核部门外的单位和个人提供，不得将本估价报告的全部或部分内容提供给其他各方，也不得见诸任何公开的媒体。若本估价报告被用于其他场合，本公司不负任何法律责任。
  para_003: 2.本估价报告依据了估价委托人提供的相关资料。估价委托人应对资料的真实性、合法性、准确性和完整性负责，如以隐瞒、欺骗等不正当手段，致使估价人员在报告中选用了错误的数据和内容，相应责任由估价委托人承担。
  para_004: 5.遵循最高最佳利用原则，评估价值应为在估价对象最高最佳利用状况下的价值或价格，最高最佳利用是房地产在法律上允许、技术上可能、财务上可行并使价值最大的合理、可能的利用，包括最佳的用途、规模和档次等。
  para_005: 4.注册房地产估价师依照中华人民共和国国家标准《房地产估价规范》（GB/T50291-2015）、《房地产估价基本术语标准》（GB/T50899-2013）进行分析，形成意见和结论，撰写本估价报告。
  para_006: 价值折算法是选取适宜方法求得估价对象房地产市场价值或价格，然后确定估价对象报酬率或资本化率，选用适当的数学公式求取折算系数，计算房地产净收益，加上运营费、相关税费等得出房地产租金的方法。
  para_007: 根据《房地产估价规范》(GB/T50291-2015) ，并参考《房地产租金评估技术指引》沪房地估协（2024）1号,估价方法通常有比较法、成本法、价值折算法、剩余法四种。
  para_008: 6.如发现本估价报告文字或数字因校对或类似原因出现差错，请及时通知本公司进行更正，如因明知正常失误而不及时通知更正而对估价结果应用造成影响和损失的，本公司不承担责任。
  para_009: 2.本估价报告中的分析、意见和结论是注册房地产估价师独立、客观、公正的专业分析、意见和结论，在估价中做到勤勉尽责，但受到本估价报告中已说明的估价假设和限制条件的限制。
  para_010: 9.本估价报告使用期限一年，请报告使用人在报告使用期内使用，否则，本估价结果无效。随着时间的推移和房地产市场的变动，国家法律政策的调整等，估价结果应作相应调整。
  para_011: 背离事实假设是指因估价目的的特殊需要、交易条件设定或约定，对估价对象状况所做的与估价对象在价值时点的状况不一致的合理假定。本次估价无背离事实假设。
  para_012: 剩余法是根据房地产经营产生的经营收入，扣除经营成本和经营利润，或根据改造完成后的房地产租赁收入，扣除需投入的改造成本，求取房地产租金的方法。
  para_013: 7.本估价报告须经注册房地产估价师签名盖章并加盖房地产估价机构公章作为一个整体时方为有效，估价报告的全部或部分复印件均无效。
  para_014: 未定事项假设指对估价所必需的尚未明确或不够明确的土地用途、容积率等事项所做的合理的、最可能的假定。本次估价无未定事项假设。
  para_015: 5.估价委托人及相关使用者应当完整地使用本报告，对仅使用报告中的部分内容或片面使用导致的有关损失，估价机构不承担责任。
  para_016: 3.注册房地产估价师与估价报告中的估价委托人没有利害关系，与估价报告中的估价对象及有关当事人也没有个人利害关系或偏见。
  para_017: 2.价值内涵：是指在公开市场上由熟悉情况且不受强迫的租赁双方，在租赁条件下自愿达成的在价值时点的最可能的租赁金额。
  para_018: 4.本次估价结果仅为委托人确定拟出租房地产市场租金提供价格参考，超出此使用范围无效，本评估机构不负法律责任。
  para_019: 1.注册房地产估价师在本估价报告中陈述的事实是真实和准确的，没有虚假记载、误导性陈述和重大遗漏。
  para_020: 本次估价遵循独立、客观、公正原则、合法原则、价值时点原则、替代原则、最高最佳利用原则。具体如下：
  para_021: 4.遵循替代原则，评估价值与估价对象的类似房地产在同等条件下的价值或价格偏差应在合理范围内；
  para_022: 比较法是根据与估价对象相似的房地产租金来经比较、调整或修正来求取估价对象房地产租金的方法。
  para_023: 1.遵循独立、客观、公正原则，评估价值应为对各方估价利害关系人均是公平合理的价值或价格；
